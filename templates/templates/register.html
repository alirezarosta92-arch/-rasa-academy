{% extends 'base.html' %}{% block title %}ثبت‌نام{% endblock %}{% block content %}<section class="formcard"><h1>ساخت حساب رسا</h1><p>برای شروع مسیر یادگیری اطلاعات زیر را وارد کن.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label>نام و نام خانوادگی</label><input name="name" required minlength="2"><label>شماره تماس</label><input name="phone" required><label>گذرواژه (حداقل ۸ نویسه)</label><input name="password" type="password" required minlength="8"><label>شیوه شرکت</label><select name="mode"><option>مجازی</option><option>حضوری</option></select><label>زمینه مورد علاقه</label><select name="interest"><option>دوره‌های مهارت‌محور</option><option>پکیج‌های آموزشی</option><option>مسیر مربیگری</option><option>همکاری در فروش</option></select><label>کد معرف (اختیاری)</label><input name="referral" value="{{session.get('referral_code','')}}"><button class="btn gold full">ثبت‌نام</button></form><p class="muted">با ثبت‌نام، اطلاعات شما در پایگاه داده این سامانه ذخیره می‌شود.</p></section>{% endblock %}
